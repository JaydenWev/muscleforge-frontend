name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: scripts/generate-api-client.sh --check
      - run: dotnet restore tests/MuscleForge.Mobile.UnitTests/MuscleForge.Mobile.UnitTests.csproj
      - run: dotnet test tests/MuscleForge.Mobile.UnitTests/MuscleForge.Mobile.UnitTests.csproj -c Release --no-restore --logger trx
      - name: Publish the exact pinned client contract
        uses: actions/upload-artifact@v4
        with:
          name: muscleforge-client-contract-${{ github.sha }}
          include-hidden-files: true
          path: |
            contracts/openapi.json
            contracts/source.json
            scripts/generate-api-client.sh
            .config/dotnet-tools.json
            nswag.json
            nswag-fixture.json
            contracts/fixtures/
            tests/MuscleForge.Mobile.UnitTests/GeneratedApiClientFixture.g.cs
            src/MuscleForge.Client/Generated/RawApiClient.g.cs
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-core-checks
          path: |
            **/TestResults/*.trx
            **/packages.lock.json

  android:
    runs-on: ubuntu-24.04
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21.0.13'
      - name: Install required Android SDK packages
        uses: android-actions/setup-android@v3
        with:
          # The default also requests the retired SDK 'tools' package.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - run: dotnet workload install maui-android
      - run: dotnet restore src/MuscleForge.Mobile/MuscleForge.Mobile.csproj
      - name: Build Android debug APK
        run: dotnet build src/MuscleForge.Mobile/MuscleForge.Mobile.csproj -c Debug --no-restore
      - name: Verify standalone APK payload
        run: python3 scripts/check-apk-payload.py src/MuscleForge.Mobile/bin/Debug/net10.0-android36.0/local.muscleforge.app-Signed.apk
      - uses: actions/upload-artifact@v4
        with:
          name: muscleforge-android-debug
          path: src/MuscleForge.Mobile/bin/Debug/**/*-Signed.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-android-lockfiles
          path: '**/packages.lock.json'
