services:
  database:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: mf_test
      POSTGRES_DB: mf_test
      POSTGRES_PASSWORD: ${MF_TEST_DB_PASSWORD:?Set a synthetic database password}
    ports:
      - "127.0.0.1:${MF_TEST_DB_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mf_test -d mf_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - database:/var/lib/postgresql/data

  api:
    image: ${MF_TEST_API_IMAGE:?Supply the explicitly built backend image}
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: https://+:8443
      ASPNETCORE_Kestrel__Certificates__Default__Path: /cert/server.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${MF_TEST_PFX_PASSWORD:?Set the synthetic certificate password}
      ConnectionStrings__Database: Host=database;Port=5432;Database=mf_test;Username=mf_test;Password=${MF_TEST_DB_PASSWORD:?Set a synthetic database password}
      Owner__Email: ${MF_TEST_EMAIL:?Set a synthetic owner email}
      Owner__Password: ${MF_TEST_PASSWORD:?Set a synthetic owner password}
    ports:
      - "${MF_TEST_BIND_ADDRESS:-127.0.0.1}:${MF_TEST_HTTPS_PORT:-8443}:8443"
    volumes:
      - ${MF_TEST_PFX_PATH:?Set an absolute synthetic PFX path}:/cert/server.pfx:ro
    depends_on:
      database:
        condition: service_healthy

volumes:
  database:
